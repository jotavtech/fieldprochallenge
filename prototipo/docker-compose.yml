services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fieldpro
      POSTGRES_PASSWORD: fieldpro
      POSTGRES_DB: fieldpro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldpro"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

# ponytail: sem volumes nomeados — banco descartável de desafio, `docker compose down` limpa tudo.
