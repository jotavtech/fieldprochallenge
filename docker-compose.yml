services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fieldpro
      POSTGRES_PASSWORD: fieldpro
      POSTGRES_DB: fieldpro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldpro -d fieldpro"]
      interval: 2s
      timeout: 3s
      retries: 20
